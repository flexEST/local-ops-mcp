[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-ops-mcp"
version = "0.1.0"
description = "A stdio MCP server for local database, LAN and bench device diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
    "paho-mqtt>=2.1,<3",
    "psycopg[binary]>=3.2,<4",
    "pyserial>=3.5,<4",
]

[project.scripts]
local-ops-mcp = "local_ops_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
