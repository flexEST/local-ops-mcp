[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-ops-mcp"
version = "0.1.0"
description = "Local router and DNS diagnostics over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",
]

[project.scripts]
local-ops-mcp = "local_ops_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
